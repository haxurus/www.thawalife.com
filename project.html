<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="Progetto di Walife, graphic designer.">
  <meta property="og:type" content="article">
  <title>Progetto – Walife</title>
  <link rel="icon" type="image/png" href="./img/favicon.png">
  <link rel="apple-touch-icon" href="./img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <script>document.documentElement.classList.add('js');</script>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./home.css">
  <link rel="stylesheet" href="./projects.css">
  <link rel="stylesheet" href="./project.css">
</head>
<body class="page-projects page-project">
  <div class="cursor" id="cursor" aria-hidden="true"><i class="cursor-dot"></i><span class="cursor-ring"><b></b></span></div>
  <div class="scroll-progress" id="scroll-progress" aria-hidden="true"></div>
  <div class="noise" aria-hidden="true"></div>

  <header class="site-header" id="site-header">
    <a class="brand" href="./index.html" aria-label="Walife home">
      <span class="brand-mark brand-logo"><img src="./img/favicon.png" alt=""></span>
      <span>WALIFE</span>
    </a>

    <nav class="site-nav" aria-label="Primary navigation">
      <a href="./index.html#work" data-i18n="navWork">Lavori</a>
      <a href="./projects.html" class="active" data-i18n="navArchive">Archivio</a>
      <a href="./index.html#services" data-i18n="navServices">Servizi</a>
      <a href="#contact" data-i18n="navContact">Contatti</a>
    </nav>

    <div class="lang" role="group" aria-label="Language / Lingua">
      <button type="button" data-lang="it" aria-pressed="true">IT</button>
      <i aria-hidden="true"></i>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
    <button class="burger" id="burger" aria-label="Open menu" aria-expanded="false"><i></i><i></i></button>
  </header>

  <div class="menu" id="menu" aria-hidden="true">
    <a href="./index.html#work" data-i18n="navWork">Lavori</a>
    <a href="./projects.html" data-i18n="navArchive">Archivio</a>
    <a href="./index.html#services" data-i18n="navServices">Servizi</a>
    <a href="#contact" data-i18n="navContact">Contatti</a>
  </div>

  <main>
    <!-- INTRO -->
    <section class="pj-hero pg-hero">
      <div class="pj-hero-glow" aria-hidden="true"></div>
      <a class="pj-back" href="./projects.html" data-i18n="pgBack">← Tutti i progetti</a>
      <p class="section-index pj-in" id="pg-idx"></p>
      <h1 class="pj-title pg-title"><span class="pj-line"><span id="pg-title"></span></span></h1>
      <dl class="pg-meta pj-in" id="pg-meta"></dl>
    </section>

    <!-- COVER -->
    <figure class="pg-cover" id="pg-cover-wrap">
      <img id="pg-cover" alt="" decoding="async">
    </figure>

    <!-- CONTENT -->
    <article class="pg-body" id="pg-body"></article>

    <!-- PREV / NEXT -->
    <nav class="pg-nav" id="pg-nav" aria-label="Project navigation"></nav>

    <!-- CONTACT -->
    <section class="contact" id="contact">
      <p class="section-index" data-i18n="ctLead">Hai un progetto in mente?</p>
      <div class="contact-main">
        <a class="magnetic" href="mailto:thawalife@gmail.com" data-cursor="WRITE"><span data-i18n="ctLink">Facciamolo visivo.</span><span class="arrow">↗</span></a>
      </div>
      <ul class="socials" id="socials"></ul>
      <div class="contact-footer">
        <span data-i18n="ctFooter">WALIFE / PORTFOLIO DI GRAPHIC DESIGN</span>
        <a href="#" class="to-top" id="to-top" data-i18n="toTop">TORNA SU ↑</a>
        <span>© <span id="year"></span></span>
      </div>
    </section>
  </main>

  <!-- LIGHTBOX -->
  <div class="lb" id="lb" role="dialog" aria-modal="true" aria-hidden="true">
    <button class="lb-close" id="lb-close" type="button" data-i18n-aria="pgClose" aria-label="Chiudi">✕</button>
    <button class="lb-arrow lb-prev" id="lb-prev" type="button" data-i18n-aria="pgPrevImg" aria-label="Immagine precedente">←</button>
    <figure class="lb-stage"><img id="lb-img" alt=""></figure>
    <button class="lb-arrow lb-next" id="lb-next" type="button" data-i18n-aria="pgNextImg" aria-label="Immagine successiva">→</button>
    <span class="lb-count" id="lb-count"></span>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.min.js"></script>
  <script src="./data.js"></script>
  <script src="./project-pages.js"></script>
  <script src="./project.js"></script>
</body>
</html>
